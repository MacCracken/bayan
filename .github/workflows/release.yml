name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # Every gate in CI runs before anything is published: all six CI jobs
  # (toolchain, static, x86_64, aarch64, oracles, dist) must pass.
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CI already proved VERSION agrees with the manifest, the CHANGELOG, and
      # every dist header. The one thing it cannot know is the tag — that is
      # this job's job.
      - name: Tag matches VERSION and has a CHANGELOG entry
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || {
            echo "::error::VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }
          grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' entry"; exit 1; }
          echo "releasing $TAG_VERSION"

      # The same setup every CI job runs: installs the cyrius.cyml pin through the
      # upstream installer and fails on pin drift (.github/actions/setup-cyrius).
      - uses: ./.github/actions/setup-cyrius

      - name: Build
        run: |
          set -euo pipefail
          cyrius deps
          mkdir -p build
          ./scripts/no-warnings.sh cyrius build src/main.cyr "build/${{ github.event.repository.name }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: build/*
