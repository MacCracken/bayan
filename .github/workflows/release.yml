name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # Every gate in CI runs before anything is published — build, smoke, tests,
  # fuzz, bench, lint, format, coverage floor, lib/-vs-pin, and the four
  # distribution checks.
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI already proved VERSION agrees with the manifest, the CHANGELOG, and
      # every dist header. The one thing it cannot know is the tag — that is
      # this job's job.
      - name: Tag matches VERSION and has a CHANGELOG entry
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || {
            echo "::error::VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }
          grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' entry"; exit 1; }
          echo "releasing $TAG_VERSION"

      - name: Install Cyrius toolchain
        run: |
          set -euo pipefail
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep 'cyrius *= *"' cyrius.cyml | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          test -n "$CYRIUS_VERSION" || { echo "::error::no [package].cyrius pin found in cyrius.cyml"; exit 1; }
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sfLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/bin" "$HOME/.cyrius/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/bin/"
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/lib/"
          chmod +x "$HOME/.cyrius/bin/"*
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"
          echo "CYRIUS_VERSION=$CYRIUS_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          cyrius deps
          mkdir -p build
          cyrius build src/main.cyr "build/${{ github.event.repository.name }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*
