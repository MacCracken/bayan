name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Six independent jobs, run in parallel (1.5.10; until then one 32-step job ran
# everything in series, so a lint slip was reported only after the whole x86
# suite, and aarch64 sat in the middle of the x86 steps). Each job checks out,
# installs the pinned toolchain through .github/actions/setup-cyrius (which also
# fails on pin drift), and gates one concern:
#
#   toolchain  the pin, the manifest's version claims, cyrius.lock and lib/
#   static     format, lint, include audit, and the source-level naming checks
#   x86_64     build, smoke, suite, fuzz, bench, coverage, mulmod + divmod cost
#   aarch64    the same program cross-built for aarch64 and run under qemu
#   oracles    independent oracles: the PDF validator, font metrics, vectors (u128, f64, toml, csv, yaml,
#              markdown, the toml tree), the markdown entity table
#   dist       the bundles, their regeneration, and the consumer/deprecation gate
#
# The committed lib/ is what every job builds against; only `toolchain` runs
# `cyrius deps`, and it proves that resolving changes nothing, so the other jobs
# skipping it measure the same tree. release.yml needs ALL six.

jobs:
  # --- the pin, the manifest, the lock, the vendored stdlib ----------------
  toolchain:
    name: Toolchain · manifest · lib/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cyrius

      # VERSION is the source of truth; everything that restates it must agree.
      # release.yml separately checks VERSION == git tag.
      - name: Version is consistent across VERSION / manifest / CHANGELOG / dist
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION '$V' is not semver"; exit 1; }
          P=$(cyrius version --project | tr -d '[:space:]')
          test "$P" = "$V" || { echo "::error::cyrius version --project ($P) != VERSION ($V)"; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$V]' entry"; exit 1; }
          for f in dist/*.cyr; do
            H=$(sed -n 's/^# Version: //p' "$f" | head -1)
            test "$H" = "$V" || {
              echo "::error file=$f::dist header says '$H', VERSION says '$V' — run 'cyrius distlib --all'"; exit 1; }
          done
          echo "version $V consistent across manifest, CHANGELOG, and all $(ls dist/*.cyr | wc -l) bundles"

      # cyrius.lock is new at 1.5.10: since 6.6.9 `cyrius deps` writes a
      # stdlib-only project's first lock, and bayan never had one. A committed
      # lock that nothing verifies is decorative, so check the COMMITTED lock
      # against the COMMITTED lib/ before `cyrius deps` gets a chance to rewrite
      # it. `--verify` exits 1 on a hash mismatch, on a vendored file the lock
      # does not cover, and on a missing lock (each measured at 1.5.10).
      - name: cyrius.lock covers the vendored lib/
        run: cyrius deps --verify

      - name: Resolve dependencies
        run: cyrius deps

      # On a correctly committed tree, resolving is a no-op: no re-vendored
      # file, no rewritten lock. A change here means lib/ or cyrius.lock was
      # committed stale. `git status --porcelain`, not `git diff`: diff cannot
      # see an UNTRACKED file, which is exactly what an uncommitted lock or a
      # newly vendored leaf is.
      - name: Resolving dependencies leaves no tree change
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- lib/ cyrius.lock)
          if [ -n "$changed" ]; then
            echo "::error::cyrius deps changed lib/ or cyrius.lock — re-vendor, relock and commit"
            printf '%s\n' "$changed"
            exit 1
          fi

      # bayan vendors the WHOLE pinned snapshot into lib/. state.md's standing
      # rule: verify by comparing the trees — a green `cyrius lib sync --full`
      # is not by itself proof (at 1.4.0 it exited 0 and left five files stale).
      - name: Vendored lib/ matches the pinned snapshot exactly
        run: |
          set -euo pipefail
          SNAP="$HOME/.cyrius/versions/${CYRIUS_VERSION}/lib"
          test -d "$SNAP" || { echo "::error::no stdlib snapshot at $SNAP"; exit 1; }
          if ! diff -rq lib "$SNAP" > "${RUNNER_TEMP}/lib-drift.txt" 2>&1; then
            echo "::error::lib/ does not match the ${CYRIUS_VERSION} snapshot — run 'cyrius lib sync --full' and commit"
            cat "${RUNNER_TEMP}/lib-drift.txt"
            exit 1
          fi
          echo "lib/ matches ${CYRIUS_VERSION} exactly ($(find lib -type f | wc -l) files, 0 differ)"

  # --- source-level checks: nothing here runs bayan ------------------------
  static:
    name: Format · lint · static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cyrius

      # A per-file loop, never `cyrius fmt src/*.cyr --check`: cyrfmt reads only
      # argv[1] and silently ignores the rest. tests/*.cyr are the standalone
      # programs CI builds and runs itself (pdf_fixture.cyr, mulmod_speed.cyr):
      # source like any other, so formatted like any other (1.5.10).
      - name: Format
        run: |
          set -euo pipefail
          fail=0
          for f in src/*.cyr tests/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -e "$f" ] || continue
            if ! out=$(cyrius fmt "$f" --check 2>&1); then
              echo "::error file=$f::not canonically formatted — run 'cyrius fmt $f'"
              echo "$out"
              fail=1
            fi
          done
          test "$fail" -eq 0 || exit 1
          echo "format clean"

      # `cyrius lint` always exits 0, so gate on what it reports, not on $?.
      - name: Lint — zero warnings, zero untracked deferrals
        run: |
          set -euo pipefail
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1)
            w=$(printf '%s\n' "$out" | sed -n 's/^\([0-9]\+\) warnings$/\1/p' | tail -1)
            d=$(printf '%s\n' "$out" | sed -n 's/^\([0-9]\+\) untracked deferrals$/\1/p' | tail -1)
            if [ "${w:-0}" -ne 0 ] || [ "${d:-0}" -ne 0 ]; then
              echo "::error file=$f::${w:-0} lint warning(s), ${d:-0} untracked deferral(s)"
              printf '%s\n' "$out" | grep -E '^[[:space:]]+(warn|deferral) ' || true
              fail=1
            fi
          done
          test "$fail" -eq 0 || exit 1
          echo "lint clean across $(ls src/*.cyr | wc -l) files"

      - name: Include-dependency audit
        run: |
          set -euo pipefail
          out=$(cyrius vet src/main.cyr 2>&1); printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '[0-9]+ deps, 0 untrusted, 0 missing' || {
            echo "::error::cyrius vet reported untrusted or missing include deps"; exit 1; }

      # lib/bayan.cyr is cyrius's fold of an OLDER bayan, vendored back into bayan's own lib/ by
      # every `lib sync --full`, so deleting it does not last. It defines every symbol src/ does,
      # and the last definition wins with only a warning, so reaching it would quietly bring back
      # what later releases fixed (1.6.1, Known gap 4). The script refuses an include of it from
      # src/, tests/ or scripts/, a `bayan` in [deps], and a `bayan` leaf in a dist/ sidecar; its
      # header has the reasons. Each of those was planted at 1.6.1 and turned this step red.
      - name: Nothing reaches the vendored fold lib/bayan.cyr
        run: ./scripts/vendored-fold-guard.sh

      # Two naming hazards, both of which are silent in cyrius.
      - name: PDF — naming hazards
        run: |
          set -euo pipefail
          # A trailing _str/_int/_cstr/_ptr claims a compiler overload slot.
          # `_by_str` is the one deliberate exception, mirroring json.cyr's
          # bayan_json_v_obj_get_by_str / _by_cstr: their base name `..._get_by`
          # does not exist, so no dispatch is ambiguous (the next step keeps it so).
          if grep -nE '^fn bayan_pdf_[a-z0-9_]*_(int|cstr|ptr)\(|^fn bayan_pdf_[a-z0-9_]*[^y]_str\(' src/pdf.cyr; then
            echo "::error::a public bayan_pdf_ name claims a reserved overload slot"; exit 1
          fi
          # A duplicate fn name in cyrius is only a warning, and last-definition
          # -wins rebinds even textually-earlier call sites. mneme's
          # src/io_export_pdf.cyr defines 14 bare _pdf_* helpers and is the named
          # consumer for this API, so it will have both files in scope during its
          # migration window. Forbid the whole bare shape, not just today's 14.
          if grep -nE '^fn _pdf_[a-z0-9]+\(' src/pdf.cyr; then
            echo "::error::bare _pdf_ helper collides with mneme/src/io_export_pdf.cyr — use a subsystem prefix"; exit 1
          fi
          echo "pdf naming hazards clear"

      # bayan_json_v_obj_get_by_str and _by_cstr (1.5.10) end in cyrius overload-slot
      # suffixes. They are inert only because the base they would attach to,
      # `bayan_json_v_obj_get_by`, does not exist. Define it and every
      # `bayan_json_v_obj_get_by(<Str>, ..)` call of matching arity is silently rerouted
      # to `_by_str` (measured on cyrius 6.6.12; the `_cstr` slot is registered but not
      # yet dispatched on, so it would join the moment a toolchain starts reading it).
      #
      # 1.11.0 gave the flat lookups the same pairs (bayan_json_get_by_str / _by_cstr, and the toml
      # ones), so the rule is general now: no fn named `<anything>_by` may exist beside them.
      - name: Typed lookups keep no overload base
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*((pub|public)[[:space:]]+)?fn[[:space:]]+[a-z0-9_]*_by[[:space:]]*\(' src/*.cyr; then
            echo "::error::a fn named *_by turns its _by_str/_by_cstr siblings into live overload slots"; exit 1
          fi
          echo "typed-lookup naming clear ($(grep -cE '^fn [a-z0-9_]*_by_(str|cstr)\(' src/*.cyr | awk -F: '{s+=$2} END {print s}') typed lookups, no *_by base)"

      # 1.10.0 typed the public names, and this keeps the next name typed too. A public constant
      # (an upper-case name declared at column 0, the top level) is a `const`: a `var` cannot be a `case` label or a stack
      # buffer's size, and it can be assigned. A public predicate (an `_is_` or `_has_` name, an
      # `_eq`, `bayan_pdf_winansi_ok`, and their _compat aliases) returns `: bool`. tests/bayan.tcyr
      # pins today's names; this catches a new one declared the old way.
      - name: Typed public names — constants are const, predicates are bool
        run: |
          set -euo pipefail
          fail=0
          if grep -nE '^var[[:space:]]+[A-Z][A-Z0-9_]*[[:space:]]*(=|;|\[)' src/*.cyr; then
            echo "::error::a public constant is declared var — declare it const"; fail=1
          fi
          if grep -nE '^fn[[:space:]]+([a-z][a-z0-9_]*_(is|has)_[a-z0-9_]*|[a-z][a-z0-9_]*_eq|bayan_pdf_winansi_ok)[[:space:]]*\(' src/*.cyr \
               | grep -vE '\)[[:space:]]*:[[:space:]]*bool[[:space:]]*\{'; then
            echo "::error::a public predicate does not return : bool"; fail=1
          fi
          test "$fail" -eq 0 || exit 1
          echo "typed public names: $(grep -cE '^const [A-Z]' src/*.cyr | awk -F: '{s+=$2} END {print s}') public consts," \
               "$(grep -cE '^fn [a-z][a-z0-9_]*\(.*\)[[:space:]]*:[[:space:]]*bool' src/*.cyr | awk -F: '{s+=$2} END {print s}') bool fns"

      # CI compiles x86_64 and aarch64, and the cx compiler is not in the
      # release toolchain, so no test compiles what a target with no
      # CYRIUS_ARCH_* macro compiles. Through 1.5.9 bayan_u64_mulmod had an x86
      # arm and an aarch64 arm and nothing else: on cx every call with a, b and
      # m below 2^63 returned 0, and both suites stayed green. This applies the
      # fn's conditionals as each target would and fails when one of them is
      # left with no arm that sets `result`, or when x86_64 or aarch64 is left
      # with no asm block (a misspelt arch macro drops the hardware arm and every
      # suite still passes, at several times the cost). It is red on the 1.5.9
      # source twice over: cx has no arm, and aarch64 has no hardware one.
      # bayan_u128_divmod (1.6.2) has hardware arms in front of a portable loop
      # every target compiles, so `:asm` checks only the asm blocks: one on
      # x86_64 and on aarch64, none on cx (whose bytes would be some other
      # machine's). A misspelt or a widened aarch64 gate each turn it red.
      - name: u64 mulmod and u128 divmod — every target compiles the right arms
        run: python3 scripts/check-arch-arms.py src/u128.cyr bayan_u64_mulmod bayan_u128_divmod:asm

  # --- x86_64: the host target ---------------------------------------------
  x86_64:
    name: x86_64 — build · test · fuzz · bench · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cyrius

      # Every build/test/fuzz/bench here goes through scripts/no-warnings.sh:
      # it fails on the exit status OR on a `warning:` anywhere in the output,
      # because cyrius only WARNS on the diagnostics that matter most (bad
      # pointer typing, lib/ shadowing, pin drift, a deprecated call) and fuzz
      # and bench exit 0 on a harness build that only warns.
      - name: Build — zero compiler warnings
        run: |
          mkdir -p build
          ./scripts/no-warnings.sh cyrius build src/main.cyr build/bayan

      - name: Smoke — full-bundle entry exits 42
        run: |
          set +e; ./build/bayan; rc=$?; set -e
          test "$rc" -eq 42 || { echo "::error::smoke exited $rc, expected 42"; exit 1; }
          echo "smoke ok (exit 42)"

      # v5.6.28: bare `cyrius test` picks up the [build].test entry AND
      # auto-discovers tests/*.tcyr. It exits 1 on a failed assert.
      - name: Test
        run: ./scripts/no-warnings.sh cyrius test

      # The deprecated lookups' answers (1.5.12). From cyrius 6.6.16 every reference
      # to a deprecated fn warns, so these rows cannot sit in the warning-free suite
      # above; the script builds them with EXACTLY their expected warnings and runs them.
      - name: Deprecated lookups still answer — exact expected warnings
        run: ./scripts/deprecated-lookup.sh build

      # `cyrius fuzz` discovers tests/*.fcyr; a harness exits non-zero on any
      # wrong answer.
      - name: Fuzz
        run: ./scripts/no-warnings.sh cyrius fuzz

      - name: Bench harness compiles and runs
        run: ./scripts/no-warnings.sh cyrius bench

      # A floor that ratchets, not a target. Raise it whenever real coverage
      # lands; never lower it to make a red build green.
      #
      # 1.5.2 set this to 100, and the reason still holds: 1.5.1 found two heap
      # overflows, a wrong 256-bit multiply and 18 other defects in modules that
      # had built clean and passed every gate for five releases while untested.
      # But that 100 was measured by the OLD counter, which matched SUBSTRINGS.
      # Every back-compat alias in src/_compat.cyr (json_parse, u256_add, ...)
      # is a substring of the bayan_* name it forwards to, so all 153 were
      # credited while the suite called ten. cyrius 6.6.8+ counts REFERENCES —
      # whole identifiers outside comments and strings — and measured 70%
      # (355/503) here. 1.5.8 added a test row for every alias (and for the
      # three canonicals nothing referenced), which makes it 501/503.
      #
      # The two left were the `main` entry points of src/main.cyr and
      # src/test.cyr, which no test can reference, so 1.5.8 set the floor to 99
      # (a correction of what 100 measured, not a lowering to go green). cyrius
      # 6.6.11 excludes the entry point `main` from `cyrius coverage`, and 1.5.9
      # moved the pin to it, so the measured figure is 501/501 and the floor is
      # back at 100. It rides the pin: under a <=6.6.10 CLI this step reads 99.6%.
      #
      # It remains reference coverage: it proves a function is CALLED, not that
      # it is called correctly. The oracle-driven vectors in the `oracles` job
      # are what check the answers.
      - name: Reference coverage floor
        run: cyrius coverage --min 100

      # The suite checks answers, and the 1.5.9 aarch64 defect had none wrong:
      # this checks the cost. A 50x limit sees a fall back to a bit-serial
      # shift-subtract loop (hundreds of x). It does not see x86 sending reduced
      # operands to the wide path: that path divides in hardware and costs ~13x,
      # inside the limit. The limit, and why it does not flake on a busy runner,
      # is in the header of tests/mulmod_speed.cyr. The aarch64 job runs the
      # same program. 1.6.2 adds bayan_u128_divmod by a 64-bit divisor, whose
      # aarch64 path was bit-serial (~650-700x) through 1.6.1.
      - name: mulmod and 128/64 divmod cost about one division
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build tests/mulmod_speed.cyr build/mulmod-speed
          ./build/mulmod-speed

      # The same kind of check for markdown (1.9.0): its cost on cmark's
      # pathological inputs must grow with the input, not its square. Every
      # answer stays right on a quadratic path, so only a cost check sees one;
      # 1.9.0's mutation pass found two such regressions that nothing else
      # caught. The method is in tests/markdown_scaling.cyr's header.
      - name: markdown cost grows linearly on pathological inputs
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build tests/markdown_scaling.cyr build/md-scaling
          ./build/md-scaling

      # And for the TOML tree parser (1.11.0): a table of n keys, n tables, n array-of-tables
      # elements, n dotted keys, n sub-table headers, long arrays, inline tables and strings. Its key
      # index keeps each line O(1); every vector would still pass without it, only slower.
      - name: toml tree cost grows linearly
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build tests/toml_scaling.cyr build/toml-scaling
          ./build/toml-scaling

      # And for the duplicate-key checks (1.11.1): yaml's mapping parser walked every key before
      # each new one (O(n^2): 40,000 keys took 14.4 s), and json's three parsers refuse
      # duplicates from 1.11.1 through a key set that must stay O(1) a key. The flat toml
      # parser's dotted keys walked every table since the header (20,000 took 4.0 s).
      - name: yaml, json and flat toml cost grows linearly in a table's keys
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build tests/parse_scaling.cyr build/parse-scaling
          ./build/parse-scaling

  # --- aarch64: the same program, cross-built and run under qemu -----------
  #
  # Until 1.5.10 no bayan gate ran aarch64. From 1.0.2 to 1.5.9 its
  # bayan_u64_mulmod took a 128-round shift-subtract on every call, ~600x a
  # plain `(a * b) % m` under qemu, and nothing could see it: every answer was
  # right, and only x86 ran. This track runs everything that executes bayan
  # code, built by the release's x86-hosted cycc_aarch64 and run through
  # /usr/bin/qemu-aarch64 (the path the cyrius CLI uses for --aarch64).
  #
  # Why not a native ubuntu-24.04-arm runner: the aarch64-linux release tarball
  # ships `cycc` but no `cyrius` CLI, cyrfmt or cyrlint (6.6.12), so `cyrius
  # test` / `fuzz` / `build` do not exist there. Cross-building on x86_64 is the
  # supported path, and it is the one consumers use.
  aarch64:
    name: aarch64 — cross-built, run under qemu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cyrius

      - name: Install qemu-user
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          test -x /usr/bin/qemu-aarch64 || {
            echo "::error::qemu-user did not install /usr/bin/qemu-aarch64, the path cyrius runs --aarch64 binaries through"; exit 1; }
          /usr/bin/qemu-aarch64 --version | head -1

      - name: Build — zero compiler warnings; smoke entry exits 42
        run: |
          set -euo pipefail
          mkdir -p build
          ./scripts/no-warnings.sh cyrius build --aarch64 src/main.cyr build/bayan-a64
          set +e; qemu-aarch64 build/bayan-a64; rc=$?; set -e
          test "$rc" -eq 42 || { echo "::error::aarch64 smoke exited $rc, expected 42"; exit 1; }
          echo "aarch64 smoke ok (exit 42)"

      - name: Test
        run: ./scripts/no-warnings.sh cyrius test --aarch64

      - name: Deprecated lookups still answer — exact expected warnings
        run: ./scripts/deprecated-lookup.sh --aarch64 build

      # `cyrius fuzz` has no --aarch64, so each tests/*.fcyr is built and run
      # by hand; a harness exits non-zero on any wrong answer. Under qemu the
      # dtoa harness (2x10^6 float round-trips) takes a few minutes, which is
      # why this is its own track rather than a step in the x86 one. Floating
      # point and the json scanners' shift-and-mask byte classes are exactly
      # what a second backend can get wrong.
      - name: Fuzz
        run: |
          set -euo pipefail
          for h in tests/*.fcyr; do
            n=$(basename "$h" .fcyr)
            ./scripts/no-warnings.sh cyrius build --aarch64 "$h" "build/fuzz-${n}-a64"
            echo "--- ${h} under qemu-aarch64"
            timeout 1200 qemu-aarch64 "build/fuzz-${n}-a64" || {
              echo "::error file=${h}::fuzz harness failed on aarch64"; exit 1; }
          done

      - name: Bench harness compiles and runs
        run: |
          set -euo pipefail
          for b in tests/*.bcyr; do
            n=$(basename "$b" .bcyr)
            ./scripts/no-warnings.sh cyrius build --aarch64 "$b" "build/bench-${n}-a64"
            qemu-aarch64 "build/bench-${n}-a64"
          done

      # The aarch64 half of the x86 job's cost check (see there): mulmod was
      # ~600x here on 1.5.9 and is ~2x now; divmod by a 64-bit divisor was
      # ~650-700x on 1.6.1 and is ~8x now (x86: ~7x, call overhead included).
      - name: mulmod and 128/64 divmod cost about one division
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build --aarch64 tests/mulmod_speed.cyr build/mulmod-speed-a64
          qemu-aarch64 build/mulmod-speed-a64

      # The aarch64 half of the x86 job's markdown cost check.
      - name: markdown cost grows linearly on pathological inputs
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build --aarch64 tests/markdown_scaling.cyr build/md-scaling-a64
          qemu-aarch64 build/md-scaling-a64

      # The aarch64 half of the x86 job's toml tree cost check (1.11.0).
      - name: toml tree cost grows linearly
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build --aarch64 tests/toml_scaling.cyr build/toml-scaling-a64
          qemu-aarch64 build/toml-scaling-a64

      # The aarch64 half of the x86 job's yaml, json and flat toml cost check (1.11.1).
      - name: yaml, json and flat toml cost grows linearly in a table's keys
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build --aarch64 tests/parse_scaling.cyr build/parse-scaling-a64
          qemu-aarch64 build/parse-scaling-a64

      # One input, two targets, one answer: the PDF writer's output must be the
      # same BYTES on aarch64 as on x86_64 (it is, measured at 1.5.10: 3,331
      # bytes), and the aarch64 file must pass the strict oracle on its own. A
      # behavioural difference between targets is a defect whatever either
      # output looks like.
      - name: PDF — writer output is byte-identical across targets
        run: |
          set -euo pipefail
          ./scripts/no-warnings.sh cyrius build tests/pdf_fixture.cyr build/pdf-fixture
          ./scripts/no-warnings.sh cyrius build --aarch64 tests/pdf_fixture.cyr build/pdf-fixture-a64
          ./build/pdf-fixture "${RUNNER_TEMP}/x86_64.pdf"
          qemu-aarch64 build/pdf-fixture-a64 "${RUNNER_TEMP}/aarch64.pdf"
          cmp "${RUNNER_TEMP}/x86_64.pdf" "${RUNNER_TEMP}/aarch64.pdf" || {
            echo "::error::the pdf fixture differs between x86_64 and aarch64"; exit 1; }
          python3 scripts/pdfcheck.py "${RUNNER_TEMP}/aarch64.pdf" --text
          echo "pdf fixture byte-identical across targets ($(stat -c%s "${RUNNER_TEMP}/aarch64.pdf") bytes)"

  # --- independent oracles: answers checked against something not bayan ----
  oracles:
    name: Oracles — PDF validator · font metrics · vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cyrius

      # scripts/pdfcheck.py is the acceptance oracle for bayan_pdf_*: a strict,
      # stdlib-only validator that checks every cross-reference offset against
      # the byte it claims to point at. Deliberately stricter than poppler and
      # mupdf, which reconstruct a broken xref by scanning for "N 0 obj" and so
      # hide exactly the byte-accounting bugs this gate exists to catch.
      - name: PDF — writer output validates against the strict oracle
        run: |
          set -euo pipefail
          mkdir -p build
          ./scripts/no-warnings.sh cyrius build tests/pdf_fixture.cyr build/pdf-fixture
          ./build/pdf-fixture "${RUNNER_TEMP}/out.pdf"
          python3 scripts/pdfcheck.py "${RUNNER_TEMP}/out.pdf" --text

      # The fixtures are polarised on purpose: ref-* must parse, bad-* must be
      # refused. A gate that only checks the happy path cannot tell a strict
      # reader from a lenient one.
      - name: PDF — fixtures keep their polarity
        run: |
          set -euo pipefail
          fail=0
          for f in tests/fixtures/pdf/ref-*.pdf; do
            python3 scripts/pdfcheck.py "$f" >/dev/null || { echo "::error file=$f::reference fixture no longer validates"; fail=1; }
          done
          for f in tests/fixtures/pdf/bad-*.pdf; do
            if python3 scripts/pdfcheck.py "$f" >/dev/null 2>&1; then
              echo "::error file=$f::corrupt fixture PASSED — the oracle has gone lenient"; fail=1
            fi
          done
          test "$fail" -eq 0
          echo "all $(ls tests/fixtures/pdf/*.pdf | wc -l) pdf fixtures behave as intended"

      # Correctness of the checked-in font metrics, with NO external
      # dependency. scripts/gen-widths.py derives them from groff's
      # afmtodit-generated Adobe metrics and therefore needs groff installed —
      # the wrong dependency for a gate, and it failed here for exactly that
      # reason (a hardcoded /usr/share/groff/<version>/ path that existed only
      # on the authoring machine). This checker decodes the tables out of
      # src/pdf.cyr and validates them against documented Adobe widths and
      # Python's own cp1252 codec, so it always runs. It is mutation-tested:
      # corrupting a width, filling an undefined code, truncating a table, or
      # breaking the WinAnsi block are each caught.
      - name: PDF — font metric tables are correct
        run: python3 scripts/check-widths.py src/pdf.cyr

      # Strictly stronger, but only possible where groff is present: prove the
      # tables still regenerate byte-for-byte from their actual source. Skipped
      # rather than failed when groff is absent, because its absence says
      # nothing about whether the tables are right.
      - name: PDF — font metric tables regenerate identically (if groff present)
        run: |
          set -euo pipefail
          if ! ls -d /usr/share/groff/*/font/devps >/dev/null 2>&1; then
            echo "groff devps metrics not installed — skipping the regeneration diff;"
            echo "the correctness check above already ran."
            exit 0
          fi
          python3 scripts/gen-widths.py "${RUNNER_TEMP}/w.cyr"
          diff <(grep -oE '^var _PDF_W[A-Z_]* = "[^"]*"' "${RUNNER_TEMP}/w.cyr") \
               <(grep -oE '^var _PDF_W[A-Z_]* = "[^"]*"' src/pdf.cyr) \
            || { echo "::error::src/pdf.cyr metric tables differ from scripts/gen-widths.py output"; exit 1; }

      # The arithmetic vectors' expected values come from Python, not from
      # bayan. Regenerating them must be reproducible, or the "independent
      # oracle" claim decays into whatever was checked in once.
      - name: Numeric vectors regenerate identically
        run: |
          set -euo pipefail
          python3 scripts/gen-numeric-vectors.py "${RUNNER_TEMP}/nv"
          diff "${RUNNER_TEMP}/nv/u128.vec" tests/fixtures/numeric/u128.vec \
            || { echo "::error::u128 vectors differ from scripts/gen-numeric-vectors.py output"; exit 1; }
          diff "${RUNNER_TEMP}/nv/f64.vec" tests/fixtures/numeric/f64.vec \
            || { echo "::error::f64 vectors differ from scripts/gen-numeric-vectors.py output"; exit 1; }
          diff "${RUNNER_TEMP}/nv/f64parse.vec" tests/fixtures/numeric/f64parse.vec \
            || { echo "::error::f64 parse vectors differ from scripts/gen-numeric-vectors.py output"; exit 1; }

      # Same contract for the TOML string vectors (1.5.3). Their oracle is
      # Python's `tomllib`, which ships in the stdlib from 3.11 — no package to
      # install, so this gate does not depend on anything the property under
      # test does not depend on (the rule the pdf metric-table gate was
      # rewritten to obey).
      #
      # This module is why the discipline is worth paying for twice: src/toml.cyr
      # returned the RAW bytes between the quotes from 1.0.0 to 1.5.2 while the
      # suite stayed green, because every TOML assertion in it had been written
      # by reading bayan's output and writing it down.
      - name: TOML string vectors regenerate identically
        run: |
          set -euo pipefail
          python3 -c 'import tomllib' \
            || { echo "::error::python3 has no tomllib (needs 3.11+); the TOML oracle cannot run"; exit 1; }
          python3 -W error scripts/gen-toml-vectors.py "${RUNNER_TEMP}/tv"
          diff "${RUNNER_TEMP}/tv/strings.vec" tests/fixtures/toml/strings.vec \
            || { echo "::error::toml vectors differ from scripts/gen-toml-vectors.py output"; exit 1; }

      # Same contract for the CSV vectors (1.7.0). Their oracle is Python's `csv`
      # module, stdlib like `tomllib`. src/csv.cyr dropped a trailing empty field,
      # wrote LF records, left a CR unquoted and split a field at the text after
      # its closing quote, all of it under a green suite that never asked a CSV
      # reader other than bayan.
      - name: CSV vectors regenerate identically
        run: |
          set -euo pipefail
          python3 -W error scripts/gen-csv-vectors.py "${RUNNER_TEMP}/cv"
          diff "${RUNNER_TEMP}/cv/csv.vec" tests/fixtures/csv/csv.vec \
            || { echo "::error::csv vectors differ from scripts/gen-csv-vectors.py output"; exit 1; }

      # And the YAML quoted-scalar vectors (1.8.0), whose oracle is PyYAML. It is
      # not in the stdlib, so the step installs the distribution's python3-yaml
      # when the import fails, as the aarch64 job installs qemu-user, and fails
      # if it still cannot import it: the oracle is never silently skipped.
      # src/yaml.cyr kept quoted bodies verbatim until 1.8.0, and each quote scan
      # stopped at the first quote character.
      - name: YAML vectors regenerate identically
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          fi
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)' \
            || { echo "::error::python3 cannot import yaml (PyYAML); the YAML oracle cannot run"; exit 1; }
          python3 -W error scripts/gen-yaml-vectors.py "${RUNNER_TEMP}/yv"
          diff "${RUNNER_TEMP}/yv/strings.vec" tests/fixtures/yaml/strings.vec \
            || { echo "::error::yaml vectors differ from scripts/gen-yaml-vectors.py output"; exit 1; }

      # The markdown vectors (1.9.0) are the upstream suites' own examples: the
      # CommonMark 0.31.2 and GFM 0.29 specs, cmark's and cmark-gfm's test files,
      # committed verbatim under tests/fixtures/markdown/upstream/. The generator
      # refuses a file whose SHA-256 is not the pinned one, and refuses an
      # exclusion whose reason (raw HTML, footnotes) the example does not bear
      # out, so neither the expected HTML nor the cut-off can drift unseen.
      - name: Markdown vectors regenerate identically
        run: |
          set -euo pipefail
          python3 -W error scripts/gen-markdown-vectors.py "${RUNNER_TEMP}/mv"
          for f in tests/fixtures/markdown/*.vec; do
            diff "${RUNNER_TEMP}/mv/$(basename "$f")" "$f" \
              || { echo "::error file=$f::markdown vectors differ from scripts/gen-markdown-vectors.py output"; exit 1; }
          done

      # The TOML tree vectors (1.11.0): tomllib's answer, a tree or a refusal, for hand-written
      # documents aimed at each rule, random ones over a small key alphabet (so tables collide and
      # keys repeat), byte-level mutations of those, and every document of the string vectors.
      # Fixed seeds, so the file regenerates byte for byte; tomllib is stdlib from 3.11.
      - name: TOML tree vectors regenerate identically
        run: |
          set -euo pipefail
          python3 -W error scripts/gen-toml-tree-vectors.py "${RUNNER_TEMP}/ttv"
          diff "${RUNNER_TEMP}/ttv/tree.vec" tests/fixtures/toml/tree.vec \
            || { echo "::error::toml tree vectors differ from scripts/gen-toml-tree-vectors.py output"; exit 1; }

      # The HTML5 entity table src/markdown_entities.cyr is generated from
      # Python's html.entities.html5, the WHATWG list CommonMark names (stdlib,
      # nothing to install).
      - name: Markdown entity table regenerates identically
        run: |
          set -euo pipefail
          python3 -W error scripts/gen-md-entities.py "${RUNNER_TEMP}/ent.cyr"
          diff "${RUNNER_TEMP}/ent.cyr" src/markdown_entities.cyr \
            || { echo "::error::src/markdown_entities.cyr differs from scripts/gen-md-entities.py output"; exit 1; }

  # --- distribution: bayan's actual product is dist/, not build/ -----------
  dist:
    name: Distribution — bundles · consumer gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cyrius

      - name: Bundles are regenerable from src/
        run: cyrius distlib --all --check

      # `git status --porcelain`, not `git diff`: a bundle or sidecar that
      # regeneration CREATES (a new [lib.<name>] profile never committed) is
      # untracked, and diff cannot see it.
      - name: Regenerating leaves no tree change
        run: |
          set -euo pipefail
          cyrius distlib --all
          changed=$(git status --porcelain -- dist/)
          if [ -n "$changed" ]; then
            echo "::error::dist/ differs after regeneration — run 'cyrius distlib --all' and commit"
            printf '%s\n' "$changed"
            git diff --stat -- dist/
            exit 1
          fi
          echo "committed dist/ is byte-identical to a fresh regeneration"

      # The other half of the contract: --check proves the bundles come from
      # src/, this proves a downstream repo can actually consume one from the
      # leaves its .deps sidecar declares. See the script header for why it
      # must build with --no-deps.
      #
      # It is also the gate for bayan's DEPRECATIONS (1.5.10): it compiles a direct
      # call of each deprecated fn against every bundle that ships it and requires
      # exactly the expected warnings at the caller, with the exact advice, and none
      # from the bundle; it refuses any reference to a deprecated fn in src/ or dist/;
      # and it pins the `key: cstring` diagnostics on bayan_json_v_obj_get_by_cstr, the
      # replacement. bayan's own build and test steps are warning-free, so this is the
      # only place a lost `#deprecated(...)` — dropped by distlib, or no longer honoured
      # by a toolchain — could be seen. See the DEPRECATED and TYPED_CSTR blocks.
      - name: Every bundle compiles as a downstream consumer
        run: ./scripts/consumer-check.sh "${RUNNER_TEMP}/consumer-check"

      # 1.5.12: under the cyrius 6.6.18 distlib every bundle opens with a
      # compile-verified "# Requires" include block, so `include "dist/bayan.cyr"`
      # with nothing before it compiles. `cyrius test` auto-prepends the
      # manifest's stdlib and would hide a missing block; --no-deps does not.
      # Against the 1.5.11 bundle this build fails (unknown type 'Str').
      - name: The bundle compiles with no prior include
        run: |
          set -euo pipefail
          mkdir -p build
          ./scripts/no-warnings.sh cyrius build --no-deps tests/bayan_raw_include.tcyr build/raw-include
          ./build/raw-include
